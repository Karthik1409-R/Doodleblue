<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Events and Forms</title>
</head>

<body>

    <h2>Task 1: Click Event</h2>
    <button id="statusButton">Click Me</button>
    <p id="status">Waiting for click...</p>

    <hr>

    <h2>Task 2: Character Count</h2>
    <input type="text" id="message" placeholder="Type something">
    <p>Character count: <span id="count">0</span></p>

    <hr>

    <h2>Tasks 3 & 4: Registration Form</h2>
    <form id="registrationForm">
        <input type="text" id="name" placeholder="Enter your name">
        <input type="email" id="email" placeholder="Enter your email">
        <button type="submit">Register</button>
    </form>
    <p id="feedback"></p>

    <hr>

    <h2>Challenge: Event Cards</h2>
    <div id="events"></div>
    <p id="eventStatus"></p>

    <script src="event-listener.js"></script>
    
</body>

</html>
